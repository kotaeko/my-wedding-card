<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="page-title">청첩장</title>

  <!-- OG 메타태그 (카카오톡 링크 공유 시 미리보기) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" id="og-title" content="고태혁 ♥ 김서아 결혼합니다 💍" />
  <meta property="og:description" id="og-description" content="2026년 7월 5일 일요일 오후 1시 20분 | 까사그랑데센트로" />
  <meta property="og:image" id="og-image" content="https://my-wedding-card.pages.dev/images/OG.webp" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Gowun+Batang:wght@400;700&display=swap"
    rel="stylesheet" />

  <!-- 스타일 -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  
  <!-- 이미지 Preload (로딩 최적화) -->
  <link rel="preload" href="images/ribbon.webp" as="image" type="image/webp" />

</head>

<body>

  <!-- 로딩 오버레이: 폰트·리소스 안정화 전까지 화면을 가림 -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-ring"></div>
  </div>

  <!-- BGM -->
  <audio id="bgm" src="images/Taylor Swift - Love Story (Lyrics).mp3" loop preload="auto"></audio>

  <div class="phone-frame" id="phone-frame">

    <!-- BGM 컨트롤 버튼 -->
    <div class="bgm-control">
      <button id="bgm-btn" class="bgm-btn" aria-label="음악 켜기/끄기">
        <svg class="bgm-icon bgm-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <svg class="bgm-icon bgm-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
    </div>

    <!-- ① 커버 (Sleeve 봉투 애니메이션) -->
    <section id="hero" class="section section-hero">
      
      <!-- Envelope Scene -->
      <div class="envelope-scene" id="envelope-scene">
        
        <!-- Envelope Back -->
        <div class="envelope-back" id="envelope-back"></div>

        <!-- 튀어나온 편지지 & 전체 콘텐츠 스크롤 래퍼 -->
        <div class="letter-scroll-wrapper" id="letter-scroll-wrapper">
          <div class="main-letter" id="main-letter">
            
            <!-- 편지지 최상단 (이름, 달력, 사진, 날짜) -->
            <div class="letter-top">
              <!-- 절대 위치 지정으로 사진 정렬에 영향 주지 않음 -->
              <div class="letter-header-content">
                <div class="letter-names">
                  <span id="letter-groom-name"></span><span class="amp">그리고</span><span id="letter-bride-name"></span>
                </div>
                <!-- 1주 달력 렌더링 컨테이너 -->
                <div class="letter-calendar" id="letter-calendar"></div>
              </div>
              
              <!-- 사진 위치를 완벽하게 잡아주는 여백 -->
              <div class="letter-photo-spacer"></div>
              
              <!-- 윈도우 홀에 정확히 맞는 이미지 -->
              <div class="letter-window-img" id="letter-window-img"></div>
              
              <div class="letter-date" id="letter-date"></div>
            </div>

            <!-- ② 초대의 글 -->
            <section id="invitation" class="section section-invitation fade-in">
              <div class="section-inner">
                <p class="invitation-parents" id="invitation-parents"></p>
                <div class="divider-floral">✦</div>
                <p class="invitation-message" id="invitation-message"></p>
              </div>
            </section>

            <!-- ③ 예식 안내 (장소 / 달력 / D-day) -->
            <section id="info" class="section section-info fade-in">
              <div class="section-inner">
                <h2 class="section-title">예식 안내</h2>
                <!-- 월간 달력 -->
                <div class="info-calendar-wrap">
                  <div id="monthly-calendar" class="monthly-calendar"></div>
                </div>
                <div class="info-venue-block">
                  <p class="info-venue-datetime" id="info-datetime"></p>
                  <p class="info-venue-place" id="info-place"></p>
                </div>
                <!-- D-day 카운트다운 -->
                <div class="countdown-wrap">
                  <p class="countdown-label">결혼식까지</p>
                  <div id="countdown" class="countdown"></div>
                </div>
              </div>
            </section>

            <!-- ⑤ 연애 타임라인 -->
            <section id="timeline-section" class="section section-timeline fade-in">
              <div class="section-inner">
                <h2 class="section-title">우리의 이야기</h2>
                <p class="timeline-subtitle" id="timeline-subtitle"></p>
                <div id="timeline-list" class="timeline-list"></div>
              </div>
            </section>

            <!-- ⑥ 갤러리 -->
            <section id="gallery" class="section section-gallery fade-in">
              <div class="section-inner">
                <h2 class="section-title">갤러리</h2>
                
                <!-- 메인 큰 폴라로이드 사진 -->
                <div class="gallery-main-wrap">
                  <div class="polaroid-card main-polaroid" id="gallery-main-card">
                    <img id="gallery-main-img" src="" alt="갤러리 메인 사진" draggable="false" loading="lazy" decoding="async">
                    <div class="photo-overlay"></div>
                  </div>
                </div>
                
                <!-- 썸네일 가로 스크롤 미리보기 -->
                <div class="gallery-thumbs-wrap">
                  <div id="gallery-thumbs-scroll" class="gallery-thumbs-scroll"></div>
                </div>
                
                <p id="gallery-empty" class="gallery-empty" style="display:none;">사진을 준비 중입니다.</p>
              </div>
            </section>

            <!-- ⑦ 오시는 길 -->
            <section id="map-section" class="section section-map fade-in">
              <div class="section-inner">
                <h2 class="section-title">오시는 길</h2>
                <p class="map-address" id="map-address"></p>
                <div class="map-wrapper">
                  <div id="kakao-map" class="kakao-map-container"></div>
                  <div id="map-overlay" class="map-overlay">
                    <div id="map-tooltip" class="map-tooltip">
                      <svg class="map-tooltip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="12" height="12">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 16V12"></path>
                        <path d="M12 8h.01"></path>
                      </svg>
                      <span>한 번 터치하면 지도를 움직일 수 있습니다</span>
                    </div>
                  </div>
                </div>
                <div class="map-buttons">
                  <a id="btn-naver-map" class="map-btn map-btn-naver" href="#" target="_blank" rel="noopener">네이버지도</a>
                  <a id="btn-kakao-map" class="map-btn map-btn-kakao" href="#" target="_blank" rel="noopener">카카오맵</a>
                </div>
                <div id="transport-list" class="transport-list"></div>
                <p id="parking-notice" class="parking-notice"></p>
              </div>
            </section>

            <!-- ⑧ 축하의 마음 & 연락처 (통합 섹션) -->
            <section id="accounts" class="section section-accounts fade-in">
              <div class="section-inner">
                <h2 class="section-title">축하의 마음 & 연락처</h2>
                <div id="accounts-list" class="accounts-list"></div>
              </div>
            </section>

            <!-- 푸터 -->
            <footer class="footer">
              <p id="footer-names"></p>
              <span class="footer-maker">made by Taehyeok✌️</span>
            </footer>

          </div>
        </div>

        <!-- Envelope Front (SVG Mask) -->
        <div class="envelope-front" id="envelope-front">
          <svg class="env-mask-svg" viewBox="0 0 340 420" preserveAspectRatio="none">
            <defs>
              <mask id="hole-mask">
                <rect width="100%" height="100%" fill="white" />
                <circle cx="170" cy="0" r="30" fill="black" />
                <rect x="70" y="150" width="200" height="200" fill="black" rx="2" />
              </mask>
            </defs>
            <!-- 봉투 베이스 배경색 (미니멀 화이트 계열) -->
            <rect width="100%" height="100%" fill="#ffffff" mask="url(#hole-mask)" />
          </svg>
          
          <!-- Ribbon Overlay (블랙 리본) -->
          <div class="ribbon-container">
            <img src="images/ribbon.webp" class="ribbon-img" alt="Ribbon">
          </div>
          
          <!-- 짧은 길이를 해결하는 봉투 무한 연장 블록 -->
          <div class="envelope-bottom-extension"></div>
        </div>

      </div>
      
    </section>

  </div><!-- /phone-frame -->


  <!-- 라이트박스 (갤러리 전체화면) -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="사진 확대">
    <button class="lightbox-close" id="lightbox-close" aria-label="닫기">✕</button>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img" class="lightbox-img" src="" alt="" />
      <div class="photo-overlay"></div>
    </div>
    <!-- 이전/다음 버튼과 페이지 수 표시부를 한 그룹으로 결합 -->
    <div class="lightbox-controls">
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="이전 사진">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lightbox-arrow-svg">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <p id="lightbox-caption" class="lightbox-caption"></p>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="다음 사진">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lightbox-arrow-svg">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <!-- 스크립트 -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=b88e001bcc97122844049fcd1f5d406c&libraries=services&autoload=false"></script>
  <script src="content.js"></script>
  <script src="js/main.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/map.js"></script>

</body>

</html>
